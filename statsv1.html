<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa 2026 — Inteligência & Probabilidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── VARIÁVEIS E BASE ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#FFDF00; --gold2:#F9A825; --green:#009B3A; 
  --bg: rgba(2, 13, 4, 0.90);          
  --card: rgba(6, 33, 10, 0.70); 
  --border: rgba(255, 255, 255, 0.08); 
  --text: #FFFFFF;        
  --muted: #A5D6A7;       
  --bar-br: linear-gradient(90deg, #009B3A, #FFDF00);
  --bar-default: linear-gradient(90deg, rgba(255,255,255,0.2), rgba(255,255,255,0.6));
}
html,body{height:100%;overflow:hidden;background-color:#020D04;}
body{
  background: radial-gradient(circle at top right, rgba(10, 50, 20, 0.6), rgba(2, 13, 4, 0.95)), url('dashboard_background.jpg') no-repeat center center fixed;
  background-size: cover;
  color:var(--text); font-family:'Inter',sans-serif;
  display:flex; flex-direction:column;
}

.watermark { position: fixed; bottom: 20px; right: 30px; font-size: 13px; color: rgba(255, 255, 255, 0.4); z-index: 9999; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; }

/* ── HEADER ── */
.hero{
  background:rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); border-bottom:1px solid var(--border);
  padding:16px 32px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; box-shadow: 0 4px 30px rgba(0,0,0,0.5);
}
.hero-left{display:flex;align-items:center;gap:20px}
.niagro-logo{width: 180px; height: 35px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));}
.icon-brain{font-size:36px; filter:drop-shadow(0 0 15px rgba(255,223,0,.5)); animation: pulse-brain 3s infinite;}
@keyframes pulse-brain { 0%, 100% {transform: scale(1); opacity: 0.8;} 50% {transform: scale(1.05); opacity: 1;} }

.title-block h1{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;color:var(--gold);line-height:1;}
.title-block .sub{font-size:12px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:4px; font-weight: 600;}

/* ── LAYOUT PRINCIPAL ── */
.main-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; flex: 1; overflow: hidden;
}
.panel-section { display: flex; flex-direction: column; gap: 16px; overflow: hidden; }

.section-title { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:2px; color:var(--text); display:flex; align-items:center; gap:10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.section-title .accent { width:6px; height:24px; background:var(--gold); border-radius:3px; }

/* ── PROBABILIDADES DE JOGOS (ODDS) ── */
.odds-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 8px; }
.odd-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.odd-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 12px; font-weight: 600; text-transform: uppercase;}
.teams-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-bottom: 16px; }
.team-name { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; text-transform: uppercase; justify-content: flex-start;}
.team-name.right { justify-content: flex-end; }
.vs { font-family: 'Bebas Neue'; font-size: 20px; color: rgba(255,255,255,0.3); text-align: center; }
.flag { font-size: 24px; }

.prob-bar-container { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: rgba(0,0,0,0.5); gap: 2px;}
.prob-segment { display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #000; transition: width 1s ease-in-out;}
.prob-home { background: #4CAF50; }
.prob-draw { background: #9E9E9E; }
.prob-away { background: #2196F3; }

.prob-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-top: 8px; color: rgba(255,255,255,0.8); gap: 8px;}
.lbl-h { color: #4CAF50; }
.lbl-d { color: #9E9E9E; }
.lbl-a { color: #2196F3; }

/* ── FAVORITOS AO TÍTULO ── */
.favorites-list { display: flex; flex-direction: column; gap: 14px; background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); }
.fav-item { display: flex; flex-direction: column; gap: 6px; }
.fav-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; text-transform: uppercase; }
.fav-name { display: flex; align-items: center; gap: 8px; }
.fav-pct { font-family: 'Bebas Neue'; font-size: 20px; color: var(--gold); }
.fav-bar-track { width: 100%; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
.fav-bar-fill { height: 100%; width: 0%; border-radius: 4px; transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

/* ── CURIOSIDADES ── */
.trivia-box { background: linear-gradient(135deg, rgba(255,223,0,0.1), rgba(6,33,10,0.8)); border: 1px solid rgba(255,223,0,0.3); border-radius: 16px; padding: 24px; margin-top: 10px; flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
.trivia-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.9; }
.trivia-title { font-family: 'Bebas Neue'; font-size: 22px; color: var(--gold); margin-bottom: 8px; letter-spacing: 1px; }
.trivia-text { font-size: 16px; line-height: 1.6; color: var(--text); font-weight: 500; min-height: 80px; transition: opacity 0.5s ease; }
.progress-line { position: absolute; bottom: 0; left: 0; height: 4px; background: var(--gold); width: 0%; transition: width linear; }

/* ── LOADING OVERLAY ── */
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2, 13, 4, 1); display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s ease;}
.spinner{width:60px;height:60px;border:4px solid rgba(255,255,255,0.1);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing
